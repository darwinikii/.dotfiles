#Variables
$mainMod = SUPER #Default for everyone(i think?)
$terminal = "kitty" #You need change kitty if you didnt want use it

#Monitor Config(You must change it with "hyprctl monitors" command)
monitor=DP-1, 1920x1080@164, 0x0, 1
monitor=HDMI-A-1, 1920x1080@72, -1920x0, 1

#Enviroment Variables in uwsm config
debug:full_cm_proto = true

#System Autostart
exec-once=hyprpm reload -nn
exec-once=swayosd-server
#exec-once=wl-paste -p --watch wl-copy -p ''
exec-once=xhost si:localuser:root

#User Autostart
exec-once=steam -silent & heroic & vesktop & spotify

#Key Binds
bindr = SUPER, SUPER_L, exec, ~/.config/wofi/start #App Launcher
bindr = $mainMod, F4, exec, ~/.config/rofi/powermenu/type-3/powermenu.sh #Powermenu for shutdown or restart
bind = CONTROL_L, Q, killactive, #Kills selected window
bind = $mainMod, Q, exec, $terminal #Launch terminal
bind = $mainMod, M, exit, #Exits Hyprland
bind = $mainMod, E, exec, nautilus -w #Starts new file manager windows(You need change nautilus if you didnt want use it)
bind = $mainMod, V, togglefloating, #Enables floating for selected window
bind = ALT, Tab, cyclenext, #Windows like Alt+Tab experience (i think)
bind = ALT, Tab, bringactivetotop, #Windows like Alt+Tab experience (i think)
bind = $mainMod, Tab, fullscreen, #Fullscreens selected app(Need for games and browsers etc...)
bind = ,Print, exec, grim -g "$(slurp)" - | swappy -f - #Screenshot and copy to clipboard
#bind = CONTROL_L, up, hyprexpo:expo, toggle

bind = SHIFT, TAB, pass, class:gamescope

#Sound Control Binding (u should use swayosd(aur) bec why not)
bindr = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindr = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindr = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise

bindr = , XF86AudioPlay, exec, /usr/bin/python3 ~/.config/waybar/bin/mediaplayer.py --play-pause
bindr = , XF86AudioPrev, exec, /usr/bin/python3 ~/.config/waybar/bin/mediaplayer.py --prev
bindr = , XF86AudioNext, exec, /usr/bin/python3 ~/.config/waybar/bin/mediaplayer.py --next

bind = CONTROL_L, right, workspace, +1
bind = CONTROL_L, left, workspace, -1

#Mouse Binds
bindm = , mouse:276, movewindow #Moves selected window
bindm = , mouse:275, resizewindow #Resizes selected window

######Need for default app location(Dont edit it)######
workspace=1, monitor:DP-1
workspace=101, monitor:HDMI-A-1
workspace=2, monitor:DP-1
workspace=102, monitor:HDMI-A-1
workspace=3, monitor:DP-1
workspace=103, monitor:HDMI-A-1
#######################################################

#Window rules
windowrule=workspace 102, class:vesktop
windowrule=workspace 101, class:^(Spotify)$
windowrule=workspace 1, class:Minecraft
windowrule=float, title:^(Steam'e Giriş Yap)$
windowrule=workspace 1, title:^(Steam'e Giriş Yap)$
windowrule=float, title:^(Arkadaş LİSTESİ)$
windowrule=float, title:^(Steam Ayarları)$
windowrule=fullscreen, class:gamescope

windowrule=opacity 0.925, fullscreen:0
windowrule=opacity 1, focus:1
windowrule=opacity 1, floating:1
#Plugin Configs
plugin {
    hyprexpo {
        columns = 2
        gap_size = 5
        bg_col = rgb(111111)
        workspace_method = first m+1 # [center/first] [workspace] e.g. first 1 or center m+1

        enable_gesture = true # laptop touchpad
        gesture_fingers = 3  # 3 or 4
        gesture_distance = 300 # how far is the "max"
        gesture_positive = true # positive = swipe down. Negative = swipe up.
    }

}
#Dont edit this section required for keyboard, mouse and other things(I dont know exactly why it's necessary but dont touch it)
input {
    kb_layout = tr
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    mouse_refocus = false 

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(844AB0FF) rgba(562F9BFF) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    shadow {
	enabled = true
        range = 4
        render_power = 3
        color  = rgba(1a1a1aee)
    }
}

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

#gestures {
#    workspace_swipe = off
#}

misc {
    #FULLY REQUIRED IF YOU DELETE THIS SECTION YOUR PC WILL BE BLOW UP
    force_default_wallpaper = -1 # Set to 0 to disable the anime mascot wallpapers
}

device {
    name = asustek-tuf-gaming-m3-mouse
    sensitivity = -0.5
}
